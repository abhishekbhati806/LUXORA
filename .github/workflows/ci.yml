name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/luxora
      NODE_ENV: development
      SERVE_CLIENT: "true"
      RATE_LIMIT_MAX: "20000"
      AUTH_RATE_LIMIT_MAX: "20000"
      JWT_SECRET: ci-only-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-fedcba9876543210fedcba9876543210

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build client
        run: npm run build

      - name: Seed demo world
        run: npm run seed

      - name: Start API + SPA
        run: |
          node server/src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:4000/api/v1/health && break
            sleep 1
            [ "$i" = 30 ] && cat server.log && exit 1
          done

      - name: API smoke (69 checks)
        run: bash scripts/api-smoke.sh

      - name: QR round-trips
        run: node scripts/verify-qr.mjs

      - name: UI render probe (19 routes, Playwright)
        run: |
          npx playwright install --with-deps chromium
          node scripts/render-probe.mjs

      - name: Server log (on failure)
        if: failure()
        run: tail -50 server.log || true
